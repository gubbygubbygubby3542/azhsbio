
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>azh</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#050505;
 color:#eee;
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding:35px 15px;
 overflow-x:hidden;
}

#particles{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
 z-index:0;
}

.container{
 position:relative;
 z-index:1;
 max-width:650px;
 margin:auto;
}

.glass{
 background:rgba(18,16,15,.78);
 backdrop-filter:blur(20px);
 -webkit-backdrop-filter:blur(20px);
 border:1px solid #ffffff20;
 border-radius:12px;
 box-shadow:0 10px 35px #0008;
}

.profile{
 text-align:center;
 padding:30px 20px;
}

.avatar{
 width:115px;
 height:115px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #ff8c32;
 box-shadow:0 0 25px #ff8c3244;
}

h1{
 font-size:30px;
 margin:15px 0 8px;
}

.username{
 color:#ff9b45;
 font-size:13px;
}

.bio{
 color:#aaa;
 font-size:14px;
 margin-top:18px;
}

nav{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
 padding:14px 8px;
 border-top:1px solid #49301e;
 border-bottom:1px solid #49301e;
}

nav button{
 font-family:Arial,sans-serif;
 font-size:13px;
 color:#ffad60;
 background:transparent;
 border:1px solid transparent;
 border-radius:2px;
 padding:10px 16px;
 cursor:pointer;
 transition:.2s;
}

nav button:hover{
 background:#ff8c3220;
 color:white;
}

nav button.active{
 background:#ff963b;
 color:#160d06;
 border:1px solid #ffb46f;
 box-shadow:0 3px 0 #a94f12;
}

.content{
 display:none;
 padding:25px;
 min-height:220px;
}

.content.active{
 display:block;
 animation:fade .3s ease;
}

@keyframes fade{
 from{opacity:0;transform:translateY(8px)}
 to{opacity:1;transform:translateY(0)}
}

.heading{
 font-size:17px;
 color:#ff963b;
 margin-bottom:22px;
}

.heading:before{
 content:"› ";
 color:#ffad60;
}

.friend{
 display:flex;
 align-items:center;
 gap:13px;
 padding:13px;
 background:#ffffff08;
 border:1px solid #ffffff18;
 border-radius:9px;
 margin-bottom:10px;
}

.friend img{
 width:43px;
 height:43px;
 border-radius:50%;
 object-fit:cover;
}

.friend-info{
 flex:1;
 font-size:14px;
}

.friend-info small{
 display:block;
 color:#888;
 margin-top:5px;
}

.friend button{
 background:#ff963b;
 border:1px solid #ffb46f;
 color:#170d05;
 padding:8px 13px;
 cursor:pointer;
 border-radius:3px;
 font-size:12px;
}

.friend button:hover{
 background:#ffad60;
}

.item{
 display:block;
 padding:14px;
 margin-bottom:10px;
 border:1px solid #ffffff18;
 background:#ffffff08;
 text-decoration:none;
 color:#ffad60;
 border-radius:7px;
 font-size:13px;
 transition:.2s;
}

.item:hover{
 border-color:#ff963b;
 background:#ff963b15;
}

/* FRIEND POPUP */

.modal-bg{
 position:fixed;
 inset:0;
 z-index:10;
 background:#000b;
 backdrop-filter:blur(7px);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal-bg.open{
 display:flex;
}

.modal{
 width:100%;
 max-width:350px;
 padding:25px;
 background:rgba(20,18,16,.96);
 border:1px solid #ff963b66;
 border-radius:12px;
 box-shadow:0 0 35px #ff963b22;
 animation:fade .2s ease;
}

.modal-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:20px;
}

.modal h2{
 font-size:19px;
 color:#ffad60;
}

.close{
 background:transparent;
 border:1px solid #ffffff25;
 color:#aaa;
 padding:6px 10px;
 cursor:pointer;
 border-radius:4px;
}

.close:hover{
 color:white;
 border-color:#ff963b;
}

.modal p{
 color:#aaa;
 font-size:13px;
 line-height:1.8;
}

footer{
 text-align:center;
 color:#666;
 font-size:11px;
 padding:25px;
}

/* MUSIC CONTROLLER */

.music-control{
 position:fixed;
 z-index:5;
 bottom:20px;
 right:20px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px 15px;
 background:rgba(20,18,16,.9);
 border:1px solid #ff963b66;
 border-radius:12px;
 backdrop-filter:blur(20px);
 box-shadow:0 5px 25px #0008;
}

.music-control button{
 background:none;
 border:none;
 color:#ffad60;
 font-size:17px;
 cursor:pointer;
}

.music-control input{
 width:85px;
 accent-color:#ff963b;
 cursor:pointer;
}

.music-label{
 color:#aaa;
 font-size:11px;
}

@media(max-width:500px){
 nav{gap:3px}
 nav button{padding:9px 10px}
 .music-control{bottom:12px;right:12px}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">

<div class="glass">

<!-- PROFILE -->

<section class="profile">
<img class="avatar"
src="https://placehold.co/200x200/171717/ff963b?text=azh"
alt="Profile">

<h1>azh</h1>
<div class="username">@azh</div>
<p class="bio">i like apples</p>
</section>

<!-- NAVIGATION -->

<nav>
<button class="active" onclick="showTab('home',this)">Home</button>
<button onclick="showTab('friends',this)">Friends</button>
<button onclick="showTab('links',this)">Links</button>
</nav>

<!-- HOME -->

<section id="home" class="content active">
<div class="heading">about me</div>
<p style="font-size:14px;color:#aaa;line-height:2">
i like apples
<br>
osa is super coolio.
</p>
</section>

<!-- FRIENDS -->

<section id="friends" class="content">
<div class="heading">my friends</div>

<div class="friend">
<img src="https://placehold.co/100x100/292929/ff963b?text=T"
alt="Test avatar">

<div class="friend-info">
test
<small>friend</small>
</div>

<button onclick="openFriend('test','test')">
View
</button>
</div>

</section>

<!-- LINKS -->

<section id="links" class="content">
<div class="heading">my links</div>

<a class="item" href="YOUR_DISCORD_LINK" target="_blank">
Discord ↗
</a>

<a class="item" href="YOUR_YOUTUBE_LINK" target="_blank">
YouTube ↗
</a>

</section>

</div>

<footer>© 2026 azh · made with care</footer>

</div>

<!-- FRIEND WINDOW -->

<div class="modal-bg" id="modal" onclick="backgroundClose(event)">
<div class="modal">

<div class="modal-top">
<h2 id="friendName">test</h2>
<button class="close" onclick="closeFriend()">✕ Close</button>
</div>

<p id="friendDescription">test</p>

</div>
</div>

<!-- MUSIC -->

<audio id="audio" src="./boyfriend.mp3" loop autoplay></audio>

<div class="music-control">
<button id="musicButton" onclick="toggleMusic()">♫</button>
<span class="music-label">Volume</span>
<input type="range" min="0" max="1" step=".01"
value=".4" id="volume">
</div>

<script>

/* TABS */

function showTab(id,button){
 document.querySelectorAll('.content').forEach(el=>{
  el.classList.remove('active');
 });
 document.getElementById(id).classList.add('active');

 document.querySelectorAll('nav button').forEach(el=>{
  el.classList.remove('active');
 });
 button.classList.add('active');
}

/* FRIEND POPUP */

function openFriend(name,description){
 document.getElementById('friendName').textContent=name;
 document.getElementById('friendDescription').textContent=description;
 document.getElementById('modal').classList.add('open');
}

function closeFriend(){
 document.getElementById('modal').classList.remove('open');
}

function backgroundClose(e){
 if(e.target.id==='modal')closeFriend();
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeFriend();
});

/* MUSIC */

const audio=document.getElementById('audio');
const musicButton=document.getElementById('musicButton');
const volume=document.getElementById('volume');

audio.volume=.4;

function toggleMusic(){
 if(audio.paused){
  audio.play().then(()=>{
   musicButton.textContent='♫';
  }).catch(()=>{});
 }else{
  audio.pause();
  musicButton.textContent='▶';
 }
}

volume.addEventListener('input',()=>{
 audio.volume=Number(volume.value);
});

audio.play().catch(()=>{
 musicButton.textContent='▶';
});

// Try again after the visitor interacts.
document.addEventListener('click',function startMusic(){
 if(audio.paused){
  audio.play().then(()=>{
   musicButton.textContent='♫';
  }).catch(()=>{});
 }
},{once:true});

/* ORANGE PARTICLES */

const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');

let w,h,particles=[];
let mouse={x:-1000,y:-1000};

function resize(){
 w=canvas.width=innerWidth;
 h=canvas.height=innerHeight;
 particles=[];

 for(let i=0;i<85;i++){
  particles.push({
   x:Math.random()*w,
   y:Math.random()*h,
   vx:(Math.random()-.5)*.4,
   vy:(Math.random()-.5)*.4,
   r:Math.random()*1.7+.5
  });
 }
}

window.addEventListener('resize',resize);

window.addEventListener('mousemove',e=>{
 mouse.x=e.clientX;
 mouse.y=e.clientY;
});

window.addEventListener('mouseout',e=>{
 if(!e.relatedTarget){
  mouse.x=-1000;
  mouse.y=-1000;
 }
});

function animate(){
 ctx.clearRect(0,0,w,h);

 particles.forEach(p=>{
  let dx=mouse.x-p.x;
  let dy=mouse.y-p.y;
  let d=Math.hypot(dx,dy);

  if(d<150&&d>0){
   let force=(150-d)/150;
   p.vx-=dx/d*force*.1;
   p.vy-=dy/d*force*.1;
  }

  p.x+=p.vx;
  p.y+=p.vy;

  p.vx*=.995;
  p.vy*=.995;

  if(p.x<0||p.x>w)p.vx*=-1;
  if(p.y<0||p.y>h)p.vy*=-1;

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle='rgba(255,140,50,.8)';
  ctx.shadowBlur=12;
  ctx.shadowColor='#ff8c32';
  ctx.fill();
  ctx.shadowBlur=0;
 });

 particles.forEach((p,i)=>{
  particles.slice(i+1).forEach(q=>{
   let d=Math.hypot(p.x-q.x,p.y-q.y);

   if(d<105){
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(q.x,q.y);
    ctx.strokeStyle=`rgba(255,140,50,${(1-d/105)*.2})`;
    ctx.stroke();
   }
  });
 });

 requestAnimationFrame(animate);
}

resize();
animate();

</script>
</body>
</html>
