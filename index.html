
<canvas id="particles"></canvas>

<style>
#particles {
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 z-index:-1;
 pointer-events:none;
}
</style>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let w,h,particles=[];
let mouse={x:-1000,y:-1000};

function resize(){
 w=canvas.width=innerWidth;
 h=canvas.height=innerHeight;
 particles=[];

 for(let i=0;i<85;i++){
  particles.push({
   x:Math.random()*w,
   y:Math.random()*h,
   vx:(Math.random()-.5)*.5,
   vy:(Math.random()-.5)*.5,
   r:Math.random()*2+1
  });
 }
}

window.addEventListener("resize",resize);

window.addEventListener("mousemove",e=>{
 mouse.x=e.clientX;
 mouse.y=e.clientY;
});

window.addEventListener("mouseout",e=>{
 if(!e.relatedTarget){
  mouse.x=-1000;
  mouse.y=-1000;
 }
});

function animate(){
 ctx.clearRect(0,0,w,h);

 particles.forEach(p=>{
  let dx=mouse.x-p.x;
  let dy=mouse.y-p.y;
  let dist=Math.sqrt(dx*dx+dy*dy);

  if(dist<150 && dist>0){
   let force=(150-dist)/150;
   p.vx-=dx/dist*force*.12;
   p.vy-=dy/dist*force*.12;
  }

  p.x+=p.vx;
  p.y+=p.vy;

  p.vx*=.99;
  p.vy*=.99;

  if(p.x<0||p.x>w)p.vx*=-1;
  if(p.y<0||p.y>h)p.vy*=-1;

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle="rgba(255,145,55,.8)";
  ctx.shadowBlur=12;
  ctx.shadowColor="#ff8c32";
  ctx.fill();
  ctx.shadowBlur=0;
 });

 particles.forEach((p,i)=>{
  particles.slice(i+1).forEach(q=>{
   let dx=p.x-q.x;
   let dy=p.y-q.y;
   let d=Math.sqrt(dx*dx+dy*dy);

   if(d<110){
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(q.x,q.y);
    ctx.strokeStyle=`rgba(255,140,50,${(1-d/110)*.25})`;
    ctx.stroke();
   }
  });
 });

 requestAnimationFrame(animate);
}

resize();
animate();
</script>
